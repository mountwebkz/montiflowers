<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>rr flowerrs - Доставка цветов</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>
body {
  font-family: 'Epilogue', sans-serif;
  background-color: #FAFAFA;
  color: #1F2937;
}
</style>

<script>
function sendToWhatsApp(event) {
  event.preventDefault();
  const name = document.getElementById('name').value;
  const phone = document.getElementById('phone').value;
  const budget = document.getElementById('budget').value;
  const description = document.getElementById('description').value;

  const message = `Здравствуйте! Хочу заказать букет:

Имя: ${name}
Телефон: ${phone}
Бюджет (тг): ${budget}
Цветы: ${description}`;

  const encodedMessage = encodeURIComponent(message);
  window.open(`https://wa.me/77765050705?text=${encodedMessage}`, '_blank');
}
</script>
</head>

<body>

<!-- HERO -->
<section class="relative min-h-[900px] bg-black text-white flex items-center">

<img class="absolute w-full h-full object-cover opacity-70"
src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?q=80&w=2070&auto=format&fit=crop">

<div class="absolute inset-0 bg-black/70"></div>

<div class="relative z-10 max-w-2xl px-6">
<h1 class="text-5xl font-bold mb-6">
ЭМОЦИИ,<br>КОТОРЫЕ ДАРЯТ СЧАСТЬЕ
</h1>

<p class="mb-8">
Стильные букеты с доставкой за 2 часа
</p>

<button onclick="document.getElementById('order-form-section').scrollIntoView({behavior:'smooth'})"
class="bg-pink-500 px-8 py-4 rounded-full">
Заказать букет
</button>

<p class="mt-6 text-sm">
Более 5000 счастливых клиентов доверяют нам
</p>

</div>
</section>

<!-- FORM -->
<section id="order-form-section" class="p-10 max-w-md mx-auto">

<h2 class="text-2xl font-bold mb-6">Заказать букет</h2>

<form onsubmit="sendToWhatsApp(event)" class="space-y-4">

<input id="name" placeholder="Имя" required class="w-full p-3 border rounded">

<input id="phone" placeholder="Телефон" required class="w-full p-3 border rounded">

<input id="budget" placeholder="Например: 50 000 тг" required class="w-full p-3 border rounded">

<textarea id="description" placeholder="Какие цветы?" required class="w-full p-3 border rounded"></textarea>

<button class="w-full bg-pink-500 text-white p-4 rounded">
Отправить в WhatsApp
</button>

</form>
</section>

<!-- FOOTER -->
<section class="p-10 text-center">

<button onclick="document.getElementById('order-form-section').scrollIntoView({behavior:'smooth'})"
class="bg-pink-500 text-white px-8 py-4 rounded-full">
Заказать букет
</button>

</section>

</body>
</html>
